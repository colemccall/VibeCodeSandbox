<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Chicago: Dense orthogonal grid + diagonal streets + lakefront curve -->
  <rect width="800" height="800" fill="#111"/>

  <!-- Horizontal roads -->
  <line x1="0" y1="80"  x2="680" y2="80"  stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="160" x2="680" y2="160" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="240" x2="680" y2="240" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="320" x2="680" y2="320" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="400" x2="680" y2="400" stroke="#fff" stroke-width="5"/>
  <line x1="0" y1="480" x2="680" y2="480" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="560" x2="680" y2="560" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="640" x2="680" y2="640" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="720" x2="680" y2="720" stroke="#fff" stroke-width="2.5"/>

  <!-- Vertical roads -->
  <line x1="80"  y1="0" x2="80"  y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="160" y1="0" x2="160" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="240" y1="0" x2="240" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="320" y1="0" x2="320" y2="800" stroke="#fff" stroke-width="5"/>
  <line x1="400" y1="0" x2="400" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="480" y1="0" x2="480" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="560" y1="0" x2="560" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="640" y1="0" x2="640" y2="800" stroke="#fff" stroke-width="4"/>

  <!-- Diagonal streets (NW→SE, like Milwaukee Ave / Clark St) -->
  <line x1="0"   y1="200" x2="600" y2="800" stroke="#fff" stroke-width="3.5"/>
  <line x1="100" y1="0"   x2="800" y2="680" stroke="#fff" stroke-width="3.5"/>
  <line x1="0"   y1="500" x2="300" y2="800" stroke="#fff" stroke-width="2"/>
  <line x1="350" y1="0"   x2="800" y2="420" stroke="#fff" stroke-width="2"/>

  <!-- Lakefront curve on the right edge (Lake Shore Drive) -->
  <path d="M 750 0 C 780 100, 800 200, 790 300 C 780 400, 760 500, 750 600 C 740 700, 750 750, 760 800"
        stroke="#fff" stroke-width="4" fill="none"/>

  <!-- Lake Michigan (right side dark blue tint) -->
  <rect x="760" y="0" width="40" height="800" fill="#1a2a4a" opacity="0.8"/>
</svg>
