<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Phoenix: Very regular grid, many parallel lines close together -->
  <rect width="800" height="800" fill="#111"/>

  <!-- Horizontal roads — dense, even spacing ~55px -->
  <line x1="0" y1="50"  x2="800" y2="50"  stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="105" x2="800" y2="105" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="215" x2="800" y2="215" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="270" x2="800" y2="270" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="325" x2="800" y2="325" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#fff" stroke-width="5"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="490" x2="800" y2="490" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="545" x2="800" y2="545" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="600" x2="800" y2="600" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="655" x2="800" y2="655" stroke="#fff" stroke-width="2.5"/>
  <line x1="0" y1="710" x2="800" y2="710" stroke="#fff" stroke-width="4"/>
  <line x1="0" y1="760" x2="800" y2="760" stroke="#fff" stroke-width="2.5"/>

  <!-- Vertical roads — equally dense -->
  <line x1="50"  y1="0" x2="50"  y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="105" y1="0" x2="105" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="160" y1="0" x2="160" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="215" y1="0" x2="215" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="270" y1="0" x2="270" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="325" y1="0" x2="325" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="380" y1="0" x2="380" y2="800" stroke="#fff" stroke-width="5"/>
  <line x1="435" y1="0" x2="435" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="490" y1="0" x2="490" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="545" y1="0" x2="545" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="600" y1="0" x2="600" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="655" y1="0" x2="655" y2="800" stroke="#fff" stroke-width="2.5"/>
  <line x1="710" y1="0" x2="710" y2="800" stroke="#fff" stroke-width="4"/>
  <line x1="760" y1="0" x2="760" y2="800" stroke="#fff" stroke-width="2.5"/>
</svg>
