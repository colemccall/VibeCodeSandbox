<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Boston: Irregular radiating streets, curves, no real grid -->
  <rect width="800" height="800" fill="#111"/>

  <!-- Radiating streets from downtown center (~380,420) -->
  <line x1="380" y1="420" x2="50"  y2="50"  stroke="#fff" stroke-width="4"/>
  <line x1="380" y1="420" x2="220" y2="20"  stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="400" y2="10"  stroke="#fff" stroke-width="3.5"/>
  <line x1="380" y1="420" x2="580" y2="30"  stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="760" y2="100" stroke="#fff" stroke-width="3.5"/>
  <line x1="380" y1="420" x2="790" y2="300" stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="780" y2="520" stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="700" y2="780" stroke="#fff" stroke-width="4"/>
  <line x1="380" y1="420" x2="460" y2="800" stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="280" y2="790" stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="80"  y2="750" stroke="#fff" stroke-width="3.5"/>
  <line x1="380" y1="420" x2="20"  y2="600" stroke="#fff" stroke-width="3"/>
  <line x1="380" y1="420" x2="10"  y2="380" stroke="#fff" stroke-width="3"/>

  <!-- Cross-cutting irregular streets (not aligned to grid) -->
  <path d="M 50 200 Q 200 180, 350 250 Q 480 310, 620 200" stroke="#fff" stroke-width="2.5" fill="none"/>
  <path d="M 100 450 Q 250 400, 400 430 Q 550 460, 700 400" stroke="#fff" stroke-width="2.5" fill="none"/>
  <path d="M 150 650 Q 300 620, 450 660 Q 580 690, 720 640" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 200 120 Q 260 280, 240 430 Q 220 560, 260 700" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 530 80  Q 560 200, 520 380 Q 490 530, 540 680" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- Curved connector roads -->
  <path d="M 100 350 Q 200 320, 300 360 Q 380 390, 400 420" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 450 180 Q 500 260, 480 350 Q 460 400, 420 430" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M 300 550 Q 350 500, 400 490 Q 460 480, 520 520" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- Small connector stubs simulating short downtown blocks -->
  <line x1="310" y1="380" x2="360" y2="360" stroke="#fff" stroke-width="1.5"/>
  <line x1="400" y1="370" x2="440" y2="390" stroke="#fff" stroke-width="1.5"/>
  <line x1="340" y1="450" x2="370" y2="480" stroke="#fff" stroke-width="1.5"/>
  <line x1="410" y1="450" x2="450" y2="440" stroke="#fff" stroke-width="1.5"/>
</svg>
