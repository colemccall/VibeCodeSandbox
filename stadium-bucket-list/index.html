<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Stadium List — FBS Bucket List Tracker</title>

  <!-- Google Fonts: Barlow Condensed + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design system (shared suite CSS) -->
  <link rel="stylesheet" href="../../design-system/theme.css" />

  <!-- Leaflet CSS (map view) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ─── Page-level layout ─── */
    body {
      background: var(--surface);
      min-height: 100vh;
    }

    /* Apply the stadium theme to the whole app wrapper */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ─── Header ─── */
    .app-header {
      background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
      padding: 0;
      flex-shrink: 0;
    }

    .header-inner {
      padding: 20px 28px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Visit count badge in header */
    .visit-count-badge {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 24px;
      padding: 6px 16px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .visit-count-badge span {
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      font-weight: 500;
    }

    /* Grid / Map toggle buttons */
    .view-toggle {
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.18);
      border-radius: 10px;
      padding: 4px;
    }

    .view-toggle-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.55);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
    }

    .view-toggle-btn.active {
      background: rgba(255,255,255,0.9);
      color: var(--grad-a);
    }

    .view-toggle-btn:hover:not(.active) {
      color: rgba(255,255,255,0.85);
    }

    /* ─── Ad: header banner (728×90) ─── */
    #ad-header {
      background: #d1d5db;
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ─── Body: sidebar + main ─── */
    .app-body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ─── Sidebar ─── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 16px;
      gap: 0;
    }

    .sidebar-section {
      margin-bottom: 24px;
    }

    .sidebar-section:last-child {
      margin-bottom: 0;
    }

    .sidebar-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    /* Conference filter — pill checkboxes */
    .conf-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .conf-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .conf-pill input[type="checkbox"] {
      display: none;
    }

    .conf-pill-label {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-mid);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none;
    }

    .conf-pill input:checked + .conf-pill-label {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    /* State dropdown */
    .state-select {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .state-select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    /* Visit status toggle: All / Visited / Unvisited */
    .status-toggle {
      display: flex;
      gap: 4px;
    }

    .status-btn {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-mid);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      text-align: center;
    }

    .status-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Name input */
    .name-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .name-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ─── Conference badge cards ─── */
    .badge-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .conf-badge-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: center;
      position: relative;
      overflow: hidden;
      /* perspective for 3D flip */
      perspective: 600px;
      transition: border-color 0.2s;
    }

    .conf-badge-card.earned {
      border-color: var(--correct-bd);
      background: var(--correct-bg);
      animation: badge-flip 0.55s ease forwards;
    }

    @keyframes badge-flip {
      0%   { transform: rotateY(0deg); }
      40%  { transform: rotateY(-90deg); }
      50%  { transform: rotateY(-90deg); }
      100% { transform: rotateY(0deg); }
    }

    .conf-badge-icon {
      font-size: 22px;
      margin-bottom: 4px;
      filter: grayscale(1);
      opacity: 0.4;
      transition: filter 0.3s, opacity 0.3s;
    }

    .conf-badge-card.earned .conf-badge-icon {
      filter: none;
      opacity: 1;
    }

    .conf-badge-name {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .conf-badge-card.earned .conf-badge-name {
      color: var(--correct);
    }

    .conf-badge-progress {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .conf-badge-check {
      position: absolute;
      top: 5px;
      right: 6px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .conf-badge-card.earned .conf-badge-check {
      opacity: 1;
    }

    /* Share button */
    .share-btn {
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .share-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .share-btn:active { transform: translateY(0); }

    /* ─── Ad: sidebar (300×250) ─── */
    #ad-sidebar {
      background: #d1d5db;
      width: 248px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      margin-top: auto;
    }

    /* ─── Main content area ─── */
    .main-content {
      flex: 1;
      min-width: 0;
      padding: 24px;
      overflow-y: auto;
    }

    /* Results summary bar */
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--text);
    }

    /* ─── Grid view ─── */
    #grid-view {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    /* Stadium card — override/extend base .bs-stadium-card */
    .bs-stadium-card {
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.1s;
    }

    .bs-stadium-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }

    .bs-stadium-card:active {
      transform: translateY(0);
    }

    .card-team {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .card-stadium-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-mid);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-location {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-capacity {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Large checkbox in card */
    .card-checkbox {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid var(--border-mid);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .bs-stadium-card.visited .card-checkbox {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    /* ─── Map view ─── */
    #map-view {
      display: none;
      height: calc(100vh - 220px);
      min-height: 400px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #map-view.active {
      display: block;
    }

    #leaflet-map {
      width: 100%;
      height: 100%;
    }

    /* Leaflet popup customization */
    .stadium-popup {
      font-family: var(--font-body);
    }

    .stadium-popup h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text);
      margin-bottom: 2px;
    }

    .stadium-popup .popup-stadium {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stadium-popup .popup-capacity {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 10px;
    }

    .popup-visit-btn {
      width: 100%;
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .popup-visit-btn.visited {
      background: var(--correct-bg);
      color: var(--correct);
      border: 1.5px solid var(--correct-bd);
    }

    .popup-visit-btn.unvisited {
      background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
      color: #fff;
    }

    .popup-visit-btn:hover { opacity: 0.85; }

    /* Custom map markers */
    .map-marker {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }

    .map-marker.visited {
      background: var(--correct);
    }

    .map-marker.unvisited {
      background: #9ca3af;
    }

    /* ─── Off-screen share card ─── */
    #share-card {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 600px;
      height: 400px;
      background: linear-gradient(135deg, #065F46 0%, #1E40AF 100%);
      border-radius: 16px;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      font-family: 'Barlow Condensed', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .share-card-title {
      font-size: 42px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .share-card-name {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .share-card-count {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 2px;
    }

    .share-card-count-label {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      font-family: 'Inter', sans-serif;
    }

    /* Overall progress bar */
    .share-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .share-progress-fill {
      height: 100%;
      background: rgba(255,255,255,0.9);
      border-radius: 4px;
      transition: width 0.3s;
    }

    /* Conference breakdown bars */
    .share-conf-grid {
      display: flex;
      gap: 12px;
      flex: 1;
      align-items: flex-end;
    }

    .share-conf-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .share-conf-bar-wrap {
      width: 100%;
      height: 60px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .share-conf-bar-fill {
      background: rgba(255,255,255,0.8);
      border-radius: 4px 4px 0 0;
      width: 100%;
      transition: height 0.3s;
    }

    .share-conf-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .share-conf-frac {
      font-size: 11px;
      font-weight: 700;
    }

    .share-card-url {
      position: absolute;
      bottom: 20px;
      right: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.05em;
    }

    /* ─── Empty state ─── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 14px;
      font-weight: 600;
    }

    /* ─── Responsive ─── */
    @media (max-width: 1100px) {
      #grid-view {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 820px) {
      .app-body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0;
        padding: 16px;
      }

      .sidebar-section {
        width: 50%;
        padding: 0 8px 16px 0;
        margin-bottom: 0;
      }

      #ad-sidebar {
        display: none;
      }
    }

    @media (max-width: 600px) {
      #grid-view {
        grid-template-columns: 1fr;
      }

      .sidebar-section {
        width: 100%;
      }

      .header-inner {
        padding: 16px;
      }

      .bs-logo {
        font-size: 22px;
      }
    }
  </style>
</head>

<body class="app-stadium">
<div id="app">

  <!-- ═══ HEADER ═══ -->
  <header class="app-header bs-header">
    <div class="header-inner">
      <!-- Left: logo + visit count -->
      <div class="header-left">
        <div>
          <div class="bs-logo">The Stadium List</div>
          <div class="bs-logo-sub">FBS Stadium Bucket List</div>
        </div>
        <div class="visit-count-badge" id="visit-count-badge">
          0 <span>/ 25 Visited</span>
        </div>
      </div>

      <!-- Right: Grid / Map toggle -->
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="btn-grid-view" onclick="switchView('grid')">
          ⊞ Grid
        </button>
        <button class="view-toggle-btn" id="btn-map-view" onclick="switchView('map')">
          ◎ Map
        </button>
      </div>
    </div>
  </header>

  <!-- ═══ AD: Header Banner (728×90) ═══ -->
  <div id="ad-header">Advertisement · 728×90</div>

  <!-- ═══ BODY: Sidebar + Main ═══ -->
  <div class="app-body">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">

      <!-- Conference filter -->
      <div class="sidebar-section">
        <span class="sidebar-label">Conference</span>
        <div class="conf-filters" id="conf-filters">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- State filter -->
      <div class="sidebar-section">
        <span class="sidebar-label">State</span>
        <div class="select-wrap">
          <select class="state-select" id="state-filter" onchange="applyFilters()">
            <option value="">All States</option>
            <!-- Populated by JS -->
          </select>
        </div>
      </div>

      <!-- Visit status toggle -->
      <div class="sidebar-section">
        <span class="sidebar-label">Show</span>
        <div class="status-toggle">
          <button class="status-btn active" data-status="all"       onclick="setStatusFilter('all')">All</button>
          <button class="status-btn"        data-status="visited"   onclick="setStatusFilter('visited')">Visited</button>
          <button class="status-btn"        data-status="unvisited" onclick="setStatusFilter('unvisited')">Unvisited</button>
        </div>
      </div>

      <!-- Name input -->
      <div class="sidebar-section">
        <span class="sidebar-label">Your Name</span>
        <input
          type="text"
          class="name-input"
          id="name-input"
          placeholder="Your name (optional)"
          oninput="saveName(this.value)"
          autocomplete="off"
        />
      </div>

      <!-- Conference badges -->
      <div class="sidebar-section">
        <span class="sidebar-label">Conference Badges</span>
        <div class="badge-grid" id="badge-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Share button -->
      <div class="sidebar-section">
        <button class="share-btn" onclick="generateShareCard()">
          📤 Share My Progress
        </button>
      </div>

      <!-- AD: Sidebar (300×250) -->
      <div id="ad-sidebar">Advertisement · 300×250</div>

    </aside>

    <!-- ── MAIN CONTENT ── -->
    <main class="main-content">

      <!-- Results summary bar -->
      <div class="results-bar">
        <div class="results-count" id="results-count">
          Showing <strong>25</strong> stadiums
        </div>
      </div>

      <!-- Grid View -->
      <div id="grid-view">
        <!-- Populated by JS -->
      </div>

      <!-- Map View -->
      <div id="map-view">
        <div id="leaflet-map"></div>
      </div>

    </main>
  </div><!-- /.app-body -->

</div><!-- /#app -->

<!-- Toast notification -->
<div id="bs-toast"></div>

<!-- ═══ OFF-SCREEN SHARE CARD (rendered to PNG via html2canvas) ═══ -->
<div id="share-card" aria-hidden="true">
  <div class="share-card-title">The Stadium List</div>
  <div class="share-card-name" id="sc-name"></div>
  <div class="share-card-count" id="sc-count">0</div>
  <div class="share-card-count-label">of 133 FBS Stadiums Visited</div>
  <div class="share-progress-bar">
    <div class="share-progress-fill" id="sc-progress-fill"></div>
  </div>
  <div class="share-conf-grid" id="sc-conf-grid">
    <!-- Populated by JS -->
  </div>
  <div class="share-card-url">stadiumlist.app</div>
