<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>
  <!-- Salt flats texture hint -->
  <rect x="0" y="0" width="900" height="700" fill="#1a0f00"/>
  <ellipse cx="200" cy="250" rx="180" ry="100" fill="#1e1408" opacity="0.6"/>

  <!-- I-80 east-west (missing) -->
  <rect x="50" y="330" width="290" height="38" rx="4" fill="#3a2000"/>
  <rect x="560" y="330" width="290" height="38" rx="4" fill="#3a2000"/>
  <line x1="70" y1="349" x2="330" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="570" y1="349" x2="830" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-15 north-south (shown) -->
  <rect x="430" y="30" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="430" y="410" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="450" y1="50" x2="450" y2="320" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="450" y1="420" x2="450" y2="660" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-15 shield -->
  <rect x="465" y="160" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="468" y="163" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="500" y="188" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="500" y="203" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="500" y="223" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">15</text>

  <!-- I-215 beltway arc (shown) -->
  <path d="M 450 310 Q 600 310 650 349 Q 700 390 650 430 Q 600 470 450 470" stroke="#3a2000" stroke-width="32" fill="none"/>
  <path d="M 450 310 Q 600 310 650 349 Q 700 390 650 430 Q 600 470 450 470" stroke="#f5d07a" stroke-width="3" fill="none" stroke-dasharray="15,8"/>

  <!-- Missing badge -->
  <circle cx="450" cy="349" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="450" y="364" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="660" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Salt Lake City, UT</text>
</svg>
