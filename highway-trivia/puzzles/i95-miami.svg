<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>
  <!-- Ocean hint -->
  <rect x="750" y="0" width="150" height="700" fill="#0a1a2a" opacity="0.5"/>

  <!-- I-95 north-south (missing) -->
  <rect x="350" y="30" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="350" y="410" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="370" y1="50" x2="370" y2="280" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="370" y1="420" x2="370" y2="660" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- Florida Turnpike parallel (shown) -->
  <rect x="480" y="30" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="480" y="410" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="500" y1="50" x2="500" y2="280" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>
  <line x1="500" y1="420" x2="500" y2="660" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>

  <!-- Turnpike label -->
  <rect x="515" y="160" width="110" height="44" rx="6" fill="#2a1800" stroke="#f5d07a" stroke-width="1"/>
  <text x="570" y="186" font-family="Arial, sans-serif" font-size="13" fill="#f5d07a" text-anchor="middle">FL TPKE</text>

  <!-- I-75 northwest diagonal (shown) -->
  <line x1="370" y1="349" x2="80" y2="600" stroke="#3a2000" stroke-width="32"/>
  <line x1="370" y1="349" x2="80" y2="600" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>

  <!-- I-75 shield -->
  <rect x="130" y="500" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="133" y="503" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="165" y="528" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="165" y="543" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="165" y="563" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">75</text>

  <!-- Missing badge -->
  <circle cx="370" cy="349" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="370" y="364" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="685" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Miami, FL</text>
</svg>
