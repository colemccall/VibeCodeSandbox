<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>

  <!-- I-40 (modern parallel, shown) -->
  <rect x="50" y="300" width="800" height="38" rx="4" fill="#3a2000"/>
  <line x1="70" y1="319" x2="830" y2="319" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- US-66 (missing, slightly offset from I-40) -->
  <rect x="50" y="390" width="330" height="38" rx="4" fill="#3a2000"/>
  <rect x="520" y="390" width="330" height="38" rx="4" fill="#3a2000"/>
  <line x1="70" y1="409" x2="370" y2="409" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>
  <line x1="530" y1="409" x2="830" y2="409" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>

  <!-- I-40 shield -->
  <rect x="130" y="230" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="133" y="233" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="165" y="258" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="165" y="273" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="165" y="293" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">40</text>

  <!-- US-62 shield -->
  <rect x="680" y="460" width="70" height="56" rx="6" fill="#f5f5f5" stroke="#1a0f00" stroke-width="2"/>
  <text x="715" y="480" font-family="Arial Black, sans-serif" font-size="10" fill="#111" text-anchor="middle" font-weight="bold">U·S</text>
  <line x1="693" y1="486" x2="743" y2="486" stroke="#111" stroke-width="1.5"/>
  <text x="715" y="508" font-family="Arial Black, sans-serif" font-size="18" fill="#111" text-anchor="middle" font-weight="bold">62</text>

  <!-- Missing badge -->
  <circle cx="450" cy="409" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="450" y="424" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="660" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Oklahoma</text>
</svg>
