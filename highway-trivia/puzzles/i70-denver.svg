<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- Background -->
  <rect width="900" height="700" fill="#1a0f00"/>
  <!-- Grid lines -->
  <line x1="0" y1="350" x2="900" y2="350" stroke="#2a1800" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="700" stroke="#2a1800" stroke-width="1"/>

  <!-- East-West highway (I-70) - missing, marked with ? -->
  <rect x="50" y="330" width="260" height="40" rx="4" fill="#3a2000"/>
  <rect x="590" y="330" width="260" height="40" rx="4" fill="#3a2000"/>
  <!-- Road markings -->
  <line x1="70" y1="350" x2="300" y2="350" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="600" y1="350" x2="830" y2="350" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- North-South highway (I-25) -->
  <rect x="430" y="50" width="40" height="280" rx="4" fill="#3a2000"/>
  <rect x="430" y="370" width="40" height="280" rx="4" fill="#3a2000"/>
  <line x1="450" y1="70" x2="450" y2="320" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="450" y1="380" x2="450" y2="630" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-25 shield (known route) -->
  <rect x="490" y="180" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="493" y="183" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="525" y="208" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="525" y="223" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="525" y="243" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">25</text>

  <!-- I-76 shield (known route, northeast) -->
  <rect x="680" y="200" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="683" y="203" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="715" y="228" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="715" y="243" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="715" y="263" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">76</text>

  <!-- Missing route badge -->
  <circle cx="450" cy="350" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="450" y="365" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <!-- Location label -->
  <text x="450" y="660" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Denver, CO</text>
</svg>
