<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>

  <!-- Loop 610 (oval beltway) -->
  <ellipse cx="450" cy="350" rx="220" ry="170" fill="none" stroke="#3a2000" stroke-width="32"/>
  <ellipse cx="450" cy="350" rx="220" ry="170" fill="none" stroke="#f5d07a" stroke-width="3" stroke-dasharray="18,8"/>

  <!-- I-10 east-west (missing) -->
  <rect x="30" y="330" width="150" height="38" rx="4" fill="#3a2000"/>
  <rect x="720" y="330" width="150" height="38" rx="4" fill="#3a2000"/>
  <line x1="50" y1="349" x2="175" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="725" y1="349" x2="850" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <!-- Through the loop -->
  <rect x="230" y="330" width="440" height="38" rx="4" fill="#3a2000"/>
  <line x1="235" y1="349" x2="665" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-45 north-south (shown) -->
  <rect x="430" y="30" width="40" height="150" rx="4" fill="#3a2000"/>
  <rect x="430" y="520" width="40" height="150" rx="4" fill="#3a2000"/>
  <line x1="450" y1="50" x2="450" y2="175" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>
  <line x1="450" y1="525" x2="450" y2="650" stroke="#f5d07a" stroke-width="3" stroke-dasharray="15,8"/>

  <!-- I-45 shield -->
  <rect x="465" y="90" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="468" y="93" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="500" y="118" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="500" y="133" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="500" y="153" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">45</text>

  <!-- 610 shield -->
  <rect x="290" y="180" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="293" y="183" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="325" y="208" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="325" y="223" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="325" y="243" font-family="Arial Black, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">610</text>

  <!-- Missing badge -->
  <circle cx="450" cy="349" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="450" y="364" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="670" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Houston, TX</text>
</svg>
