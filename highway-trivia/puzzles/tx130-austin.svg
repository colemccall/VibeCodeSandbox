<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- Background -->
  <rect width="900" height="700" fill="#1a0f00"/>
  <!-- Subtle grid -->
  <line x1="0" y1="350" x2="900" y2="350" stroke="#2a1800" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="700" stroke="#2a1800" stroke-width="1"/>

  <!-- I-35 (north-south, through central Austin) -->
  <rect x="310" y="50" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="310" y="390" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="330" y1="70" x2="330" y2="300" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="330" y1="400" x2="330" y2="630" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- TX-45 (east-west toll, north Austin) -->
  <rect x="50" y="210" width="230" height="36" rx="4" fill="#3a2000"/>
  <rect x="390" y="210" width="460" height="36" rx="4" fill="#3a2000"/>
  <line x1="65" y1="228" x2="270" y2="228" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="400" y1="228" x2="830" y2="228" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- TX-130 bypass (north-south, east of Austin) — missing, broken road -->
  <rect x="590" y="50" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="590" y="390" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="610" y1="70" x2="610" y2="300" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="610" y1="400" x2="610" y2="630" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-35 shield (known route) -->
  <rect x="150" y="420" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="153" y="423" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="183" y="448" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="183" y="463" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="183" y="483" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">35</text>

  <!-- TX-45 shield (known route) -->
  <rect x="700" y="120" width="76" height="56" rx="6" fill="#c0392b"/>
  <rect x="703" y="123" width="70" height="50" rx="4" fill="#c0392b" stroke="#f5d07a" stroke-width="2"/>
  <text x="738" y="143" font-family="Arial Black, sans-serif" font-size="10" fill="#f5d07a" text-anchor="middle" font-weight="bold">TEXAS</text>
  <text x="738" y="163" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">45</text>

  <!-- Missing route badge (? marker at intersection of TX-130 and TX-45) -->
  <circle cx="610" cy="350" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="610" y="365" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <!-- Location label -->
  <text x="450" y="660" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Austin, TX</text>
</svg>
