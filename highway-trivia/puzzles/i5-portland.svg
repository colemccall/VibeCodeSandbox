<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>

  <!-- I-5 north-south (missing) -->
  <rect x="390" y="30" width="40" height="260" rx="4" fill="#3a2000"/>
  <rect x="390" y="410" width="40" height="260" rx="4" fill="#3a2000"/>
  <line x1="410" y1="50" x2="410" y2="280" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="410" y1="420" x2="410" y2="660" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-84 east-west (shown) -->
  <rect x="410" y="330" width="460" height="38" rx="4" fill="#3a2000"/>
  <line x1="420" y1="349" x2="850" y2="349" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-84 shield -->
  <rect x="650" y="360" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="653" y="363" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="685" y="388" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="685" y="403" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="685" y="423" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">84</text>

  <!-- Willamette River (decorative) -->
  <path d="M 300 50 Q 350 200 330 350 Q 310 500 340 660" stroke="#1a3a8f" stroke-width="18" fill="none" opacity="0.5"/>
  <path d="M 300 50 Q 350 200 330 350 Q 310 500 340 660" stroke="#2255aa" stroke-width="12" fill="none" opacity="0.4"/>

  <!-- Missing badge -->
  <circle cx="410" cy="349" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="410" y="364" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="685" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Portland, OR</text>
</svg>
