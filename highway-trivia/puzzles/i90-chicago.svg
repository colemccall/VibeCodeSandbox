<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <rect width="900" height="700" fill="#1a0f00"/>
  <line x1="0" y1="350" x2="900" y2="350" stroke="#2a1800" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="700" stroke="#2a1800" stroke-width="1"/>

  <!-- East-West highway top (I-90, missing) -->
  <rect x="50" y="250" width="340" height="38" rx="4" fill="#3a2000"/>
  <rect x="510" y="250" width="340" height="38" rx="4" fill="#3a2000"/>
  <line x1="70" y1="269" x2="380" y2="269" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="520" y1="269" x2="830" y2="269" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- East-West highway bottom (I-94, shown) -->
  <rect x="50" y="400" width="340" height="38" rx="4" fill="#3a2000"/>
  <rect x="510" y="400" width="340" height="38" rx="4" fill="#3a2000"/>
  <line x1="70" y1="419" x2="380" y2="419" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>
  <line x1="520" y1="419" x2="830" y2="419" stroke="#f5d07a" stroke-width="4" stroke-dasharray="20,10"/>

  <!-- I-94 shield -->
  <rect x="100" y="440" width="70" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="103" y="443" width="64" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="135" y="468" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="135" y="483" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="135" y="503" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">94</text>

  <!-- I-290 shield (spur) -->
  <rect x="560" y="300" width="80" height="70" rx="8" fill="#1a3a8f"/>
  <rect x="563" y="303" width="74" height="64" rx="6" fill="#1a3a8f" stroke="#f5d07a" stroke-width="2"/>
  <text x="600" y="328" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">INTER-</text>
  <text x="600" y="343" font-family="Arial Black, sans-serif" font-size="11" fill="#f5d07a" text-anchor="middle" font-weight="bold">STATE</text>
  <text x="600" y="363" font-family="Arial Black, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">290</text>

  <!-- Missing badge -->
  <circle cx="450" cy="269" r="48" fill="#b45309" stroke="#f5d07a" stroke-width="3"/>
  <text x="450" y="284" font-family="Arial Black, sans-serif" font-size="42" fill="#fff7ed" text-anchor="middle" font-weight="bold">?</text>

  <text x="450" y="660" font-family="Arial, sans-serif" font-size="18" fill="#f5d07a" text-anchor="middle" opacity="0.7">Chicago, IL</text>
</svg>
